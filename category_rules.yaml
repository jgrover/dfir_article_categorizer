# DFIR article category rules — source of truth.
# Edit this file, then regenerate JSON:
#   python tools/yaml_to_json.py
#
# Consumers that cannot depend on PyYAML should load category_rules.json.
# Category order matters: exclusive rules are first-match, so keep
# DFIR Jobs, Mental Health, and Training and Certifications first.
#
# Regex notes:
#   - Patterns are compiled with re.IGNORECASE.
#   - Prefer single-quoted YAML strings so backslashes stay literal.
#   - A `|` block is fine for long patterns; the converter keeps newlines out.
#   - JSON escaping is different (\\b not \b). Do not hand-edit the JSON.

version: 1
fallback: 'Digital forensics (general)'
max_labels: 4
editorial_types:
  - 'Editorial'
  - 'Erratum'
  - 'Letter'
editorial_category: 'Editorial & commentary'

special_cases:
  - id: 'aboutdfir_nuggets'
    notes: 'AboutDFIR Infosec News Nuggets posts are IR/malware roundups, not general news.'
    title_pattern: 'infosec\s+news\s+nuggets'
    blob_contains: 'aboutdfir'
    blob_fields:
      - 'source'
      - 'author'
      - 'url'
      - 'id'
    labels:
      - 'Incident Response & Malware'

categories:
  - name: 'DFIR Jobs'
    exclusive: true
    notes: 'Exclusive first-match: hiring posts and job boards return only this label.'
    patterns:
      - '\bdfir jobs\b'
      - '\bjobs (?:round[- ]?up|update|listing|board)\b'
      - '\bdigital forensics jobs\b'
      - '\bforensics? jobs\b'
